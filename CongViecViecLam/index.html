<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TP - KCN</title>
    <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/1040/1040241.png" type="image/png">
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --success: #22c55e;
            --danger: #ef4444;
            --gray: #64748b;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #f8fafc 0%, #e0e7ff 100%);
            color: #1e2937;
            min-height: 100vh;
        }
        
        header {
            background: white;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            padding: 1.2rem 2.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .logo {
            font-size: 1.85rem;
            font-weight: 700;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .container {
            max-width: 1300px;
            margin: 2.5rem auto;
            padding: 0 1.5rem;
            display: flex;
            gap: 2.2rem;
        }
        
        .sidebar {
            width: 310px;
            background: white;
            border-radius: 20px;
            padding: 1.8rem;
            box-shadow: 0 10px 30px rgba(99, 102, 241, 0.12);
            height: fit-content;
            position: sticky;
            top: 90px;
        }
        
        .main-content {
            flex: 1;
            background: white;
            border-radius: 20px;
            padding: 2.5rem;
            box-shadow: 0 10px 30px rgba(99, 102, 241, 0.12);
        }
        
        h2 { font-size: 1.8rem; margin-bottom: 1.5rem; color: #1e2937; }
        h3 { margin-bottom: 1.2rem; color: #374151; }
        
        .category-item {
            padding: 15px 18px;
            margin-bottom: 8px;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
        }
        .category-item:hover { background: #f0f0ff; transform: translateX(8px); }
        .category-item.active {
            background: var(--primary);
            color: white;
            box-shadow: 0 5px 15px rgba(99, 102, 241, 0.35);
        }
        
        .task-item {
            display: flex;
            align-items: center;
            padding: 18px 22px;
            background: #f8fafc;
            border-radius: 16px;
            margin-bottom: 16px;
            transition: all 0.3s;
            box-shadow: 0 3px 10px rgba(0,0,0,0.06);
        }
        .task-item:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 25px rgba(99, 102, 241, 0.18);
        }
        
        .task-content {
            flex: 1;
            min-width: 0;
        }
        .task-title {
            font-size: 1.1rem;
            margin-bottom: 4px;
            word-break: break-word;
        }
        .task-link {
            font-size: 0.9rem;
            color: var(--primary);
            text-decoration: none;
            display: inline-block;
            margin-top: 4px;
        }
        .task-link:hover { text-decoration: underline; }
        .completed .task-title { 
            text-decoration: line-through; 
            opacity: 0.65; 
        }
        
        button {
            border: none;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-primary {
            background: var(--primary);
            color: white;
            padding: 12px 24px;
        }
        .btn-primary:hover { background: var(--primary-dark); transform: translateY(-2px); }
        
        .btn-outline {
            background: transparent;
            border: 2px solid var(--primary);
            color: var(--primary);
            padding: 10px 20px;
        }
        
        .modal {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.65);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal-content {
            background: white;
            padding: 2.5rem;
            border-radius: 20px;
            width: 90%;
            max-width: 500px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.25);
        }
        
        input, textarea {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 1rem;
            margin-bottom: 12px;
        }
        input:focus, textarea:focus {
            outline: none;
            border-color: var(--primary);
        }
        
        .duplicate-alert {
            background: #fef3c7;
            border-left: 5px solid #f59e0b;
            padding: 16px;
            border-radius: 12px;
            margin: 15px 0;
            color: #92400e;
            font-size: 0.95rem;
        }
        
        .task-actions button {
            padding: 6px 14px;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">📋 JobList</div>
        <div style="display: flex; align-items: center; gap: 16px;">
            <span id="user-info" style="font-weight: 600; color: var(--gray);"></span>
            <button onclick="logout()" id="logout-btn" class="btn-outline" style="display: none;">Đăng xuất</button>
        </div>
    </header>

    <div class="container">
        <!-- Sidebar -->
        <div class="sidebar">
            <h3>📂 Danh mục</h3>
            <button onclick="showAddCategoryModal()" class="btn-primary" style="width:100%; margin: 18px 0 25px 0;">
                + Thêm danh mục
            </button>
            <div id="category-list"></div>
        </div>

        <!-- Main -->
        <div class="main-content">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:2rem;">
                <h2 id="current-category-name">Chọn danh mục để bắt đầu</h2>
                <div style="display:flex; gap:12px;">
                    <button onclick="checkDuplicates()" class="btn-outline">🔍 Kiểm tra trùng</button>
                    <button onclick="showAddTaskModal()" class="btn-primary">+ Thêm bài viết / Job</button>
                </div>
            </div>
            
            <div id="duplicate-warning" class="duplicate-alert" style="display:none;"></div>
            <div id="task-list"></div>
        </div>
    </div>

    <!-- Login Modal -->
    <div id="login-modal" class="modal">
        <div class="modal-content">
            <h2 style="text-align:center;margin-bottom:2rem;">Đăng nhập</h2>
            <button onclick="loginWithGoogle()" class="btn-primary" style="width:100%;padding:16px;margin:10px 0;font-size:1.1rem;">
                Google
            </button>
            <button onclick="loginWithFacebook()" class="btn-primary" style="width:100%;padding:16px;margin:10px 0;font-size:1.1rem;background:#1877f2;">
                Facebook
            </button>
            <button onclick="loginWithTwitter()" class="btn-primary" style="width:100%;padding:16px;margin:10px 0;font-size:1.1rem;background:#000;">
                𝕏 X (Twitter)
            </button>
        </div>
    </div>

    <!-- Add Category -->
    <div id="add-category-modal" class="modal">
        <div class="modal-content">
            <h3>Thêm danh mục mới</h3>
            <input type="text" id="new-category-name" placeholder="Tên danh mục...">
            <div style="margin-top:20px;display:flex;gap:12px;justify-content:flex-end;">
                <button onclick="hideAddCategoryModal()" class="btn-outline">Hủy</button>
                <button onclick="addCategory()" class="btn-primary">Thêm</button>
            </div>
        </div>
    </div>

    <!-- Add Task / Job -->
    <div id="add-task-modal" class="modal">
        <div class="modal-content">
            <h3>Thêm bài viết / Công việc mới</h3>
            
            <input type="text" id="new-task-title" placeholder="Tiêu đề / Tên công việc">
            <input type="url" id="new-task-link" placeholder="Link gốc (https://...)">
            
            <div id="similarity-warning" class="duplicate-alert" style="display:none;"></div>
            
            <div style="margin-top:25px;display:flex;gap:12px;justify-content:flex-end;">
                <button onclick="hideAddTaskModal()" class="btn-outline">Hủy</button>
                <button onclick="addTask()" class="btn-primary">Lưu</button>
            </div>
        </div>
    </div>

    <script>
        // === FIREBASE ===
        const firebaseConfig = {
          apiKey: "AIzaSyCrGw3XrCMnExaw66X4a5P6rN_mY_eelGw",
          authDomain: "barcarataz.firebaseapp.com",
          databaseURL: "https://barcarataz-default-rtdb.firebaseio.com",
          projectId: "barcarataz",
          storageBucket: "barcarataz.firebasestorage.app",
          messagingSenderId: "26303330608",
          appId: "1:26303330608:web:27e2ee6b5025636c8ff0f5"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();

        let currentUser = null;
        let currentCategory = null;
        let allTasksCache = {};

        // Similarity
        function similarity(s1, s2) {
            s1 = (s1 || "").toLowerCase().trim();
            s2 = (s2 || "").toLowerCase().trim();
            if (s1 === s2) return 100;
            if (!s1 || !s2) return 0;
            const len = Math.max(s1.length, s2.length);
            return Math.round(((len - levenshteinDistance(s1, s2)) / len) * 100);
        }

        function levenshteinDistance(a, b) {
            const matrix = Array.from({length: b.length + 1}, (_, i) => [i]);
            for (let j = 0; j <= a.length; j++) matrix[0][j] = j;
            for (let i = 1; i <= b.length; i++) {
                for (let j = 1; j <= a.length; j++) {
                    const cost = a[j-1] === b[i-1] ? 0 : 1;
                    matrix[i][j] = Math.min(matrix[i-1][j] + 1, matrix[i][j-1] + 1, matrix[i-1][j-1] + cost);
                }
            }
            return matrix[b.length][a.length];
        }

        // Auth
        auth.onAuthStateChanged(user => {
            if (user) {
                currentUser = user;
                document.getElementById('login-modal').style.display = 'none';
                document.getElementById('user-info').textContent = `👋 ${user.displayName || user.email}`;
                document.getElementById('logout-btn').style.display = 'block';
                loadCategories();
            } else {
                document.getElementById('login-modal').style.display = 'flex';
            }
        });

        function loginWithGoogle() { auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()); }
        function loginWithFacebook() { auth.signInWithPopup(new firebase.auth.FacebookAuthProvider()); }
        function loginWithTwitter() { auth.signInWithPopup(new firebase.auth.TwitterAuthProvider()); }
        function logout() { auth.signOut(); }

        // Categories
        function loadCategories() {
            db.ref(`users/${currentUser.uid}/categories`).on('value', snap => {
                renderCategories(snap.val() || {});
            });
        }

        function renderCategories(cats) {
            const container = document.getElementById('category-list');
            container.innerHTML = '';
            Object.keys(cats).forEach(key => {
                const div = document.createElement('div');
                div.className = `category-item ${currentCategory === key ? 'active' : ''}`;
                div.textContent = cats[key].name;
                div.onclick = () => {
                    currentCategory = key;
                    renderCategories(cats);
                    document.getElementById('current-category-name').textContent = cats[key].name;
                    loadTasks(key);
                };
                container.appendChild(div);
            });
        }

        function showAddCategoryModal() { document.getElementById('add-category-modal').style.display = 'flex'; }
        function hideAddCategoryModal() { document.getElementById('add-category-modal').style.display = 'none'; }

        function addCategory() {
            const name = document.getElementById('new-category-name').value.trim();
            if (!name) return alert("Vui lòng nhập tên danh mục");
            db.ref(`users/${currentUser.uid}/categories`).push({ name });
            hideAddCategoryModal();
            document.getElementById('new-category-name').value = '';
        }

        // Tasks
        function loadTasks(catId) {
            db.ref(`users/${currentUser.uid}/categories/${catId}/tasks`).on('value', snap => {
                allTasksCache = snap.val() || {};
                renderTasks(allTasksCache);
            });
        }

        function renderTasks(tasks) {
            const container = document.getElementById('task-list');
            container.innerHTML = '';

            if (Object.keys(tasks).length === 0) {
                container.innerHTML = `<p style="text-align:center;padding:60px 20px;color:#64748b;font-size:1.1rem;">Chưa có bài viết / công việc nào.<br>Hãy thêm mới!</p>`;
                return;
            }

            Object.keys(tasks).forEach(key => {
                const t = tasks[key];
                const div = document.createElement('div');
                div.className = `task-item ${t.completed ? 'completed' : ''}`;
                div.innerHTML = `
                    <input type="checkbox" style="margin-right:18px;" ${t.completed ? 'checked' : ''} onchange="toggleComplete('${key}', this.checked)">
                    <div class="task-content">
                        <div class="task-title">${t.title}</div>
                        ${t.originalLink ? `<a href="${t.originalLink}" target="_blank" class="task-link">🔗 ${t.originalLink}</a>` : ''}
                    </div>
                    <div class="task-actions" style="display:flex;gap:8px;">
                        <button onclick="deleteTask('${key}')" style="background:var(--danger);color:white;padding:8px 16px;">Xóa</button>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        function showAddTaskModal() {
            if (!currentCategory) return alert("Vui lòng chọn danh mục trước!");
            document.getElementById('add-task-modal').style.display = 'flex';
            document.getElementById('new-task-title').focus();
        }

        function hideAddTaskModal() {
            document.getElementById('add-task-modal').style.display = 'none';
            document.getElementById('similarity-warning').style.display = 'none';
        }

        function addTask() {
            const title = document.getElementById('new-task-title').value.trim();
            const link = document.getElementById('new-task-link').value.trim();

            if (!title) return alert("Vui lòng nhập tiêu đề!");

            // Kiểm tra trùng lặp
            let maxSim = 0;
            let dupTitle = "";
            Object.values(allTasksCache).forEach(task => {
                const sim = similarity(title, task.title);
                if (sim > maxSim) {
                    maxSim = sim;
                    dupTitle = task.title;
                }
            });

            if (maxSim >= 80) {
                const warn = document.getElementById('similarity-warning');
                warn.innerHTML = `⚠️ Trùng lặp <strong>${maxSim}%</strong> với: <br>"${dupTitle}"`;
                warn.style.display = 'block';
                return;
            }

            // Lưu
            db.ref(`users/${currentUser.uid}/categories/${currentCategory}/tasks`).push({
                title: title,
                originalLink: link || null,
                completed: false,
                createdAt: Date.now()
            });

            hideAddTaskModal();
            document.getElementById('new-task-title').value = '';
            document.getElementById('new-task-link').value = '';
        }

        function toggleComplete(taskId, completed) {
            db.ref(`users/${currentUser.uid}/categories/${currentCategory}/tasks/${taskId}`).update({ completed });
        }

        function deleteTask(taskId) {
            if (confirm("Xóa bài viết / công việc này?")) {
                db.ref(`users/${currentUser.uid}/categories/${currentCategory}/tasks/${taskId}`).remove();
            }
        }

        function checkDuplicates() {
            const tasks = Object.values(allTasksCache);
            if (tasks.length < 2) return alert("Cần ít nhất 2 công việc để kiểm tra!");

            let found = [];
            for (let i = 0; i < tasks.length; i++) {
                for (let j = i + 1; j < tasks.length; j++) {
                    const sim = similarity(tasks[i].title, tasks[j].title);
                    if (sim >= 80) found.push({t1: tasks[i].title, t2: tasks[j].title, sim});
                }
            }

            const warning = document.getElementById('duplicate-warning');
            if (found.length > 0) {
                let html = `<strong>Phát hiện ${found.length} trùng lặp:</strong><br>`;
                found.forEach(f => html += `• ${f.t1} <b>(${f.sim}%)</b> ~ ${f.t2}<br>`);
                warning.innerHTML = html;
            } else {
                warning.innerHTML = '✅ Không có trùng lặp nào (≥80%)';
            }
            warning.style.display = 'block';
        }

        // Close modals
        document.querySelectorAll('.modal').forEach(modal => {
            modal.addEventListener('click', e => {
                if (e.target === modal) modal.style.display = 'none';
            });
        });
    </script>
</body>
</html>
