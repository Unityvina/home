<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TP - KCN</title>
    <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/1040/1040241.png" type="image/png">
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --success: #22c55e;
            --danger: #ef4444;
            --gray: #64748b;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #f8fafc 0%, #e0e7ff 100%);
            color: #1e2937;
            min-height: 100vh;
        }
        
        header {
            background: white;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            padding: 1.2rem 2.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .logo {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .container {
            max-width: 1280px;
            margin: 2.5rem auto;
            padding: 0 1.5rem;
            display: flex;
            gap: 2rem;
        }
        
        .sidebar {
            width: 300px;
            background: white;
            border-radius: 20px;
            padding: 1.8rem;
            box-shadow: 0 10px 30px rgba(99, 102, 241, 0.1);
            height: fit-content;
        }
        
        .main-content {
            flex: 1;
            background: white;
            border-radius: 20px;
            padding: 2.5rem;
            box-shadow: 0 10px 30px rgba(99, 102, 241, 0.1);
        }
        
        h2 {
            color: #1e2937;
            margin-bottom: 1.5rem;
            font-size: 1.75rem;
        }
        
        .category-item {
            padding: 14px 18px;
            margin-bottom: 8px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
        }
        .category-item:hover {
            background: #f0f0ff;
            transform: translateX(6px);
        }
        .category-item.active {
            background: var(--primary);
            color: white;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
        }
        
        .task-item {
            display: flex;
            align-items: center;
            padding: 16px 20px;
            background: #f8fafc;
            border-radius: 16px;
            margin-bottom: 14px;
            transition: all 0.3s;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .task-item:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(99, 102, 241, 0.15);
        }
        
        .task-title {
            flex: 1;
            font-size: 1.05rem;
        }
        .completed { 
            text-decoration: line-through; 
            opacity: 0.65; 
            color: var(--gray);
        }
        
        button {
            border: none;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn-primary {
            background: var(--primary);
            color: white;
            padding: 12px 24px;
        }
        .btn-primary:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
        }
        
        .btn-outline {
            background: transparent;
            border: 2px solid var(--primary);
            color: var(--primary);
            padding: 10px 20px;
        }
        
        .modal {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.65);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal-content {
            background: white;
            padding: 2.5rem;
            border-radius: 20px;
            width: 90%;
            max-width: 460px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
        }
        
        input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 1.05rem;
            transition: border 0.3s;
        }
        input:focus {
            outline: none;
            border-color: var(--primary);
        }
        
        .duplicate-alert {
            background: #fef3c7;
            border-left: 5px solid #f59e0b;
            padding: 16px;
            border-radius: 12px;
            margin: 15px 0;
            color: #92400e;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">📋 JobList</div>
        <div style="display: flex; align-items: center; gap: 15px;">
            <span id="user-info" style="font-weight: 600; color: var(--gray);"></span>
            <button onclick="logout()" id="logout-btn" class="btn-outline" style="display: none; padding: 8px 18px;">Đăng xuất</button>
        </div>
    </header>

    <div class="container">
        <!-- Sidebar -->
        <div class="sidebar">
            <h3 style="margin-bottom: 1.2rem; color: #374151;">📂 Danh mục</h3>
            <button onclick="showAddCategoryModal()" class="btn-primary" style="width: 100%; margin-bottom: 20px;">
                + Thêm danh mục mới
            </button>
            <div id="category-list"></div>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
                <h2 id="current-category-name">Chọn một danh mục</h2>
                <div style="display: flex; gap: 12px;">
                    <button onclick="checkDuplicates()" class="btn-outline">🔍 Kiểm tra trùng</button>
                    <button onclick="showAddTaskModal()" class="btn-primary">+ Thêm công việc</button>
                </div>
            </div>
            
            <div id="duplicate-warning" class="duplicate-alert" style="display: none;"></div>
            
            <div id="task-list"></div>
        </div>
    </div>

    <!-- Modals -->
    <div id="login-modal" class="modal">
        <div class="modal-content">
            <h2 style="text-align:center; margin-bottom: 2rem;">Đăng nhập để tiếp tục</h2>
            <button onclick="loginWithGoogle()" class="btn-primary" style="width:100%; margin:10px 0; padding:16px; font-size:1.1rem;">
                <img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg" width="28" height="28" style="margin-right:12px;"> Google
            </button>
            <button onclick="loginWithFacebook()" class="btn-primary" style="width:100%; margin:10px 0; padding:16px; font-size:1.1rem; background:#1877f2;">
                <strong style="font-size:1.4rem;">f</strong> Facebook
            </button>
            <button onclick="loginWithTwitter()" class="btn-primary" style="width:100%; margin:10px 0; padding:16px; font-size:1.1rem; background:#000;">
                𝕏 Twitter / X
            </button>
        </div>
    </div>

    <div id="add-category-modal" class="modal">
        <div class="modal-content">
            <h3 style="margin-bottom:1.5rem;">Thêm danh mục mới</h3>
            <input type="text" id="new-category-name" placeholder="Tên danh mục (ví dụ: Học tập, Công việc...)" />
            <div style="margin-top: 1.5rem; display:flex; gap:12px; justify-content:flex-end;">
                <button onclick="hideAddCategoryModal()" class="btn-outline">Hủy</button>
                <button onclick="addCategory()" class="btn-primary">Thêm danh mục</button>
            </div>
        </div>
    </div>

    <div id="add-task-modal" class="modal">
        <div class="modal-content">
            <h3 style="margin-bottom:1.5rem;">Thêm công việc mới</h3>
            <input type="text" id="new-task-title" placeholder="Nhập nội dung công việc..." />
            <div id="similarity-warning" class="duplicate-alert" style="display:none; margin-top:15px;"></div>
            
            <div style="margin-top: 1.8rem; display:flex; gap:12px; justify-content:flex-end;">
                <button onclick="hideAddTaskModal()" class="btn-outline">Hủy</button>
                <button onclick="addTask()" class="btn-primary">Lưu công việc</button>
            </div>
        </div>
    </div>

    <script>
        // Firebase
        const firebaseConfig = {
          apiKey: "AIzaSyCrGw3XrCMnExaw66X4a5P6rN_mY_eelGw",
          authDomain: "barcarataz.firebaseapp.com",
          databaseURL: "https://barcarataz-default-rtdb.firebaseio.com",
          projectId: "barcarataz",
          storageBucket: "barcarataz.firebasestorage.app",
          messagingSenderId: "26303330608",
          appId: "1:26303330608:web:27e2ee6b5025636c8ff0f5"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();

        let currentUser = null;
        let currentCategory = null;
        let allTasksCache = {};

        // String Similarity
        function similarity(s1, s2) {
            s1 = s1.toLowerCase().trim();
            s2 = s2.toLowerCase().trim();
            if (s1 === s2) return 100;
            const len = Math.max(s1.length, s2.length);
            const dist = levenshteinDistance(s1, s2);
            return Math.round(((len - dist) / len) * 100);
        }

        function levenshteinDistance(a, b) {
            const matrix = Array.from({length: b.length + 1}, (_, i) => [i]);
            for (let j = 0; j <= a.length; j++) matrix[0][j] = j;
            
            for (let i = 1; i <= b.length; i++) {
                for (let j = 1; j <= a.length; j++) {
                    const cost = a[j-1] === b[i-1] ? 0 : 1;
                    matrix[i][j] = Math.min(
                        matrix[i-1][j] + 1,
                        matrix[i][j-1] + 1,
                        matrix[i-1][j-1] + cost
                    );
                }
            }
            return matrix[b.length][a.length];
        }

        // Auth
        auth.onAuthStateChanged(user => {
            if (user) {
                currentUser = user;
                document.getElementById('login-modal').style.display = 'none';
                document.getElementById('user-info').innerHTML = `👋 ${user.displayName || user.email.split('@')[0]}`;
                document.getElementById('logout-btn').style.display = 'block';
                loadCategories();
            } else {
                document.getElementById('login-modal').style.display = 'flex';
            }
        });

        function loginWithGoogle() { auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()); }
        function loginWithFacebook() { auth.signInWithPopup(new firebase.auth.FacebookAuthProvider()); }
        function loginWithTwitter() { auth.signInWithPopup(new firebase.auth.TwitterAuthProvider()); }
        function logout() { auth.signOut(); }

        // Categories
        function loadCategories() {
            db.ref(`users/${currentUser.uid}/categories`).on('value', snap => {
                renderCategories(snap.val() || {});
            });
        }

        function renderCategories(categories) {
            const container = document.getElementById('category-list');
            container.innerHTML = '';
            
            Object.keys(categories).forEach(key => {
                const cat = categories[key];
                const div = document.createElement('div');
                div.className = `category-item ${currentCategory === key ? 'active' : ''}`;
                div.textContent = cat.name;
                div.onclick = () => {
                    currentCategory = key;
                    renderCategories(categories);
                    document.getElementById('current-category-name').textContent = cat.name;
                    loadTasks(key);
                };
                container.appendChild(div);
            });
        }

        function showAddCategoryModal() { document.getElementById('add-category-modal').style.display = 'flex'; }
        function hideAddCategoryModal() { document.getElementById('add-category-modal').style.display = 'none'; }

        function addCategory() {
            const name = document.getElementById('new-category-name').value.trim();
            if (!name) return;
            db.ref(`users/${currentUser.uid}/categories`).push({ name });
            hideAddCategoryModal();
            document.getElementById('new-category-name').value = '';
        }

        // Tasks
        function loadTasks(catId) {
            db.ref(`users/${currentUser.uid}/categories/${catId}/tasks`).on('value', snap => {
                allTasksCache = snap.val() || {};
                renderTasks(allTasksCache);
            });
        }

        function renderTasks(tasks) {
            const container = document.getElementById('task-list');
            container.innerHTML = Object.keys(tasks).length === 0 
                ? `<p style="text-align:center; color:#64748b; padding:40px;">Chưa có công việc nào trong danh mục này.</p>`
                : '';

            Object.keys(tasks).forEach(key => {
                const t = tasks[key];
                const div = document.createElement('div');
                div.className = 'task-item';
                div.innerHTML = `
                    <input type="checkbox" ${t.completed ? 'checked' : ''} onchange="toggleComplete('${key}', this.checked)">
                    <div class="task-title ${t.completed ? 'completed' : ''}">${t.title}</div>
                    <button onclick="deleteTask('${key}')" style="background:var(--danger); color:white; padding:8px 16px; font-size:0.9rem;">Xóa</button>
                `;
                container.appendChild(div);
            });
        }

        function showAddTaskModal() {
            if (!currentCategory) return alert("Vui lòng chọn danh mục trước!");
            document.getElementById('add-task-modal').style.display = 'flex';
            document.getElementById('new-task-title').focus();
        }
        function hideAddTaskModal() {
            document.getElementById('add-task-modal').style.display = 'none';
            document.getElementById('similarity-warning').style.display = 'none';
        }

        // === NGĂN LƯU TRÙNG LẶP ===
        function addTask() {
            const titleInput = document.getElementById('new-task-title');
            const title = titleInput.value.trim();
            if (!title || !currentCategory) return;

            // Kiểm tra trùng lặp
            let maxSim = 0;
            let duplicateTitle = "";

            Object.values(allTasksCache).forEach(task => {
                const sim = similarity(title, task.title);
                if (sim > maxSim) {
                    maxSim = sim;
                    duplicateTitle = task.title;
                }
            });

            if (maxSim >= 80) {
                const warning = document.getElementById('similarity-warning');
                warning.innerHTML = `⚠️ Công việc này giống <strong>${maxSim}%</strong> với: <br>"${duplicateTitle}"<br><small>Không cho phép lưu trùng lặp!</small>`;
                warning.style.display = 'block';
                return;
            }

            // Lưu nếu không trùng
            db.ref(`users/${currentUser.uid}/categories/${currentCategory}/tasks`).push({
                title: title,
                completed: false,
                createdAt: Date.now()
            });

            hideAddTaskModal();
            titleInput.value = '';
        }

        function toggleComplete(taskId, completed) {
            db.ref(`users/${currentUser.uid}/categories/${currentCategory}/tasks/${taskId}`).update({ completed });
        }

        function deleteTask(taskId) {
            if (confirm("Xóa công việc này?")) {
                db.ref(`users/${currentUser.uid}/categories/${currentCategory}/tasks/${taskId}`).remove();
            }
        }

        function checkDuplicates() {
            const tasks = Object.values(allTasksCache);
            if (tasks.length < 2) {
                alert("Cần ít nhất 2 công việc để kiểm tra trùng lặp!");
                return;
            }

            let found = [];
            for (let i = 0; i < tasks.length; i++) {
                for (let j = i+1; j < tasks.length; j++) {
                    const sim = similarity(tasks[i].title, tasks[j].title);
                    if (sim >= 80) {
                        found.push({t1: tasks[i].title, t2: tasks[j].title, sim});
                    }
                }
            }

            const warning = document.getElementById('duplicate-warning');
            if (found.length > 0) {
                let html = `<strong>Phát hiện ${found.length} cặp trùng lặp:</strong><br>`;
                found.forEach(f => html += `• ${f.t1} <strong>(${f.sim}%)</strong> ~ ${f.t2}<br>`);
                warning.innerHTML = html;
                warning.style.display = 'block';
            } else {
                warning.innerHTML = '✅ Không có công việc trùng lặp (≥ 80%)';
                warning.style.display = 'block';
                setTimeout(() => warning.style.display = 'none', 6000);
            }
        }

        // Close modals
        document.querySelectorAll('.modal').forEach(modal => {
            modal.addEventListener('click', e => {
                if (e.target === modal) modal.style.display = 'none';
            });
        });
    </script>
</body>
</html>
